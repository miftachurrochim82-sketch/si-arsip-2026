<script>
// ============================================================
// SI-ARSIP - J_Api.html (v1 shell, 2026-09-20)
// ------------------------------------------------------------
// Wrapper pemanggilan server + loader per modul.
// callServer(action, data) disediakan AppCore (bridge google.script.run
// ke handleAction → CoreLib.dispatchAction → localHandlers 02_AppLogic).
//
// Loader modul transaksi (sm/sk/dp/master/kearsipan) DITAMBAHKAN bertahap
// sesuai 08_GAP_LIST; endpoint sudah terdaftar di 06_API_FLOW.
// ============================================================
window.ArsipApi = {
  methods: {
    // Dashboard ringkas (handler get_dashboard → dashRingkas_):
    // data = { periode, surat_masuk_bulan_ini, surat_keluar_bulan_ini,
    //          disposisi_menunggu, disposisi_lewat_sla }
    async loadDashboard() {
      this.dashLoading = true;
      this.muatNotifikasi();   // v1.4: badge lonceng ikut segar
      // Label panel butuh peta surat & pejabat (cache sesi, senyap jika gagal)
      this.ensureSmMap();
      this.loadPejabat();
      this.loadSimpegLookup();
      this.loadKlasifikasi();   // v1.2.1: chip klasifikasi panel = kode — uraian
      try {
        const [rKpi, rTren, rKlas, rDp, rKrit, rSla] = await Promise.all([
          this.callServer('get_dashboard', {}),
          this.callServer('dash_chart_tren', { bulan: 12 }),
          this.callServer('dash_klasifikasi', {}),
          this.callServer('dash_chart_disposisi', {}),
          this.callServer('dash_surat_kritis', {}),
          this.callServer('dash_disposisi_lewat_sla', {})
        ]);
        if (rKpi && rKpi.success) this.dashData = rKpi.data;
        else this.showToast((rKpi && rKpi.error) || 'Gagal memuat dashboard', 'error');
        if (rTren && rTren.success) this.dashTren = rTren.data;
        if (rKlas && rKlas.success) this.dashKlas = rKlas.data;
        if (rDp && rDp.success) this.dashDpChart = rDp.data;
        if (rKrit && rKrit.success) this.dashKritis = rKrit.data || [];
        if (rSla && rSla.success) this.dashSla = rSla.data || [];
      } catch (e) {
        this.showToast(e.message, 'error');
      } finally {
        this.dashLoading = false;
      }
    },

    // ---------- SURAT MASUK (tahap 2) ----------
    // sm_get_list: { search, filters{tanggal_dari,sampai,kode,sifat,status}, page, limit }
    // → { success, data[..+is_kritis], meta{page,totalPages,totalData} }
    async loadSm(page) {
      this.smLoading = true;
      if (page) this.smPage = page;
      try {
        const r = await this.callServer('sm_get_list', {
          search: (this.smFilters && this.smFilters.search) || '',
          filters: this.smFilters,
          page: this.smPage,
          limit: 10
        });
        if (r && r.success) {
          this.smList = r.data || [];
          const m = r.meta || {};
          this.smTotalPages = m.totalPages || 1;
          this.smTotalData = m.totalData || 0;
        } else {
          this.showToast((r && r.error) || 'Gagal memuat surat masuk', 'error');
        }
      } catch (e) {
        this.showToast(e.message, 'error');
      } finally {
        this.smLoading = false;
      }
    },

    // Master klasifikasi ANRI (M1) via ref_get_list — opsi select & label
    async loadKlasifikasi() {
      if (this.klasifikasiList.length) return;   // cache sesi
      this.klasifikasiLoading = true;
      try {
        const r = await this.callServer('ref_get_list', {});
        if (r && r.success) {
          this.klasifikasiList = (r.data || []).filter(k => String(k.status_aktif || 'true') === 'true');
        } else {
          this.showToast((r && r.error) || 'Gagal memuat klasifikasi', 'error');
        }
      } catch (e) {
        this.showToast(e.message, 'error');
      } finally {
        this.klasifikasiLoading = false;
      }
    },

    // ---------- DISPOSISI (tahap 2b) ----------
    async loadDp(page) {
      this.dpLoading = true;
      if (page) this.dpPage = page;
      try {
        const r = await this.callServer('dp_get_list', {
          filters: this.dpFilters, page: this.dpPage, limit: 10
        });
        if (r && r.success) {
          this.dpList = r.data || [];
          const m = r.meta || {};
          this.dpTotalPages = m.totalPages || 1;
          this.dpTotalData = m.totalData || 0;
        } else {
          this.showToast((r && r.error) || 'Gagal memuat disposisi', 'error');
        }
      } catch (e) {

      } finally {
        this.dpLoading = false;
      }
    },

    // ---------- SURAT KELUAR (tahap 2b) ----------

        });
        if (r && r.success) {
          this.skList = r.data || [];
          const m = r.meta || {};
          this.skTotalPages = m.totalPages || 1;

    async loadRef(force) {
      if (this.refList.length && !force) return;
      this.refLoading = true;
      try {
        const r = await this.callServer('ref_get_list', {});

    },
    async loadPjb(force) {

        const r = await this.callServer('pjb_get_list', {});

    // ---------- LOOKUP LINTAS-MODUL ----------

        if (r && r.success) this.pejabatList = r.data || [];
      } catch (e) { /* senyap: label fallback ke id */ }
    },
    // Referensi SIMPEG read-only (nama pegawai/jabatan untuk label)
    async loadSimpegLookup() {
      if (this.simpegLookup) return;
      try {
        const r = await this.callServer('get_simpeg_lookup', {});
        if (r && r.success) this.simpegLookup = r.data || { pegawai: [], unit: [], jabatan: [] };
      } catch (e) { this.simpegLookup = { pegawai: [], unit: [], jabatan: [] }; }
    },
    // Peta id→ringkasan surat masuk (join tabel disposisi tanpa N+1 call)
    async ensureSmMap() {
      if (this.smMapLoaded) return;
      try {
        const r = await this.callServer('sm_get_list', { search: '', filters: {}, page: 1, limit: 500 });
        if (r && r.success) {
          const map = {};
          (r.data || []).forEach(s => { map[s.id] = s; });
          this.smMap = map;
          this.smMapLoaded = true;
        }
      } catch (e) { /* senyap */ }
    },

    // ---------- NASKAH DINAS (v1.1) ----------

    // ---------- PENCARIAN LINTAS (v1.1) ----------
    async runSearch() {
      this.searching = true;
      this.searchDone = false;
      try {
        const r = await this.callServer('search_all', {
          q: this.searchQ, jenis: this.searchJenis,
          tahun: this.searchTahun, kode_klasifikasi: this.searchKode
        });
        if (r && r.success) {
          this.searchResults = r.data || [];
          this.searchDone = true;
          if (r.message) this.showToast(r.message, 'info');
        } else {
          this.showToast((r && r.error) || 'Pencarian gagal.', 'error');
        }
      } catch (e) {
        this.showToast(e.message, 'error');
      } finally {
        this.searching = false;
      }
    },

    // ---------- LAPORAN REKAP v1.5 (L4/L5/L11/L12) ----------

      this.lapKlasLoading = true;

    async exportKhasBulanan() {
      this.lapKhasLoading = true;
      try {
        const r = await this.callServer('laporan_export_khas', { ym: this.lapKhasBulan });
        if (r && r.success) {
          this.lapKhasUrl = r.data.url;
          this.lapKhasNama = r.data.nama;
          this.showToast('Export khas siap: ' + r.data.nama, 'success');
        } else {
          this.showToast((r && r.error) || 'Export khas gagal', 'error');
        }
      } catch (e) { this.showToast(e.message, 'error'); }
      finally { this.lapKhasLoading = false; }
    },

    // ---------- ANALISA v1.6 (A3/A4/A5) ----------

    },
    async loadAnalisaTop() {

    },
    async loadAnalisaBeban() {
      this.analisaLoading = true;

    },
    async loadAnalisaAll() {
      await Promise.all([this.loadAnalisaUnit(), this.loadAnalisaTop(), this.loadAnalisaBeban(),
                         this.loadAnalisaRetensi(), this.loadAnalisaKlasUnit(), this.loadAnalisaTte(),
                         this.loadAnalisaSla(), this.loadAnalisaKritis()]);
    },
    // ---------- ANALISA LANJUT v1.7 (A6-A10) ----------
    async loadAnalisaRetensi() {
      this.analisaLoading = true;

    },

        if (r && r.success) this.analisaKlasUnitData = r.data;
        else this.showToast((r && r.error) || 'Gagal korelasi klas-unit', 'error');
      } catch (e) { this.showToast(e.message, 'error'); }
      finally { this.analisaLoading = false; }
    },
    async loadAnalisaTte() {

    },

    // ---------- RTL v1.9 (R1-R5) ----------
    async loadRtl(page) {
      this.rtlLoading = true;
      if (page) this.rtlPage = page;
      try {
        const r = await this.callServer('rtl_get_list', { search: this.rtlSearch, filters: this.rtlFilters, page: this.rtlPage, limit: 10 });

          const m = r.meta || {};

        }
      } catch (e) { this.showToast(e.message, 'error'); }
      finally { this.rtlLoading = false; }
    },
    async generateRtl() {
      this.rtlGenerating = true;
      try {
        const r = await this.callServer('rtl_generate', { sumber: this.rtlGenerateSumber, tahun: this.rtlGenerateTahun });
        if (r && r.success) {
          this.showToast('Generate RTL: ' + r.data.generated + ' item baru', 'success');
          this.loadRtl(1);
        } else {
          this.showToast((r && r.error) || 'Generate RTL gagal', 'error');
        }
      } catch (e) { this.showToast(e.message, 'error'); }
      finally { this.rtlGenerating = false; }
    },
    openRtlEdit(r) {
      this.rtlForm = {
        id: r.id || '',
        sumber_evaluasi: r.sumber_evaluasi || 'manual',
        judul_rtl: r.judul_rtl || '',
        deskripsi: r.deskripsi || '',
        assigned_to: r.assigned_to || '',
        due_date: r.due_date ? String(r.due_date).slice(0,10) : '',
        status_rtl: r.status_rtl || 'baru',
        progress_pct: r.progress_pct != null ? r.progress_pct : 0,
        dokumen_terkait: r.dokumen_terkait || '',
        catatan: r.catatan || ''
      };
      this.showRtlForm = true;
    },
    async simpanRtl() {
      if (!this.rtlForm.judul_rtl || !String(this.rtlForm.judul_rtl).trim()) {
        this.showToast('Judul RTL wajib diisi', 'error'); return;
      }
      this.rtlSaving = true;
      try {
        const r = await this.callServer('rtl_save', { record: this.rtlForm });
        if (r && r.success) {
          this.showToast('RTL disimpan', 'success');
          this.showRtlForm = false;
          this.loadRtl(this.rtlPage);
        } else {
          this.showToast((r && r.error) || 'Gagal simpan RTL', 'error');
        }
      } catch (e) { this.showToast(e.message, 'error'); }
      finally { this.rtlSaving = false; }
    },
    async hapusRtl(r) {
      if (!confirm('Hapus RTL \"' + (r.judul_rtl||'') + '\"?')) return;
      try {
        const res = await this.callServer('rtl_delete', { id: r.id });
        if (res && res.success) {
          this.showToast('RTL dihapus', 'success');
          this.loadRtl(this.rtlPage);
        } else {
          this.showToast((res && res.error) || 'Gagal hapus RTL', 'error');
        }
      } catch (e) { this.showToast(e.message, 'error'); }
    },
    openRtlStatus(r) {
      this.rtlStatusTarget = r;
      this.rtlStatusBaru = r.status_rtl || 'baru';
      this.rtlStatusProgress = r.progress_pct != null ? r.progress_pct : 0;
      this.rtlStatusCatatan = '';
      this.showRtlStatusForm = true;
    },
    async ubahStatusRtl() {
      if (!this.rtlStatusTarget || !this.rtlStatusTarget.id) return;
      this.rtlSaving = true;
      try {
        const res = await this.callServer('rtl_ubah_status', {
          id: this.rtlStatusTarget.id,
          status_baru: this.rtlStatusBaru,
          progress_pct: this.rtlStatusProgress,
          catatan: this.rtlStatusCatatan
        });
        if (res && res.success) {
          this.showToast('Status RTL diubah', 'success');
          this.showRtlStatusForm = false;
          this.loadRtl(this.rtlPage);
        } else {
          this.showToast((res && res.error) || 'Gagal ubah status', 'error');
        }
      } catch (e) { this.showToast(e.message, 'error'); }
      finally { this.rtlSaving = false; }
    }
  }
};
</script>
